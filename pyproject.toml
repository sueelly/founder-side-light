[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "founder-side-light"
version = "0.2.0"
description = "Four local terminal personality interviews with Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "prompt-toolkit>=3.0.50,<4"]

[project.urls]
Repository = "https://github.com/sueelly/founder-side-light"

[project.optional-dependencies]
test = ["pytest>=9,<10", "setuptools>=68", "wheel>=0.45"]

[project.scripts]
founder-light = "harness.__main__:main"

[tool.setuptools]
packages = [
    "harness",
    "harness.resources",
    "harness.resources.candidate_runtime",
    "harness.resources.materials",
    "harness.resources.prompts",
    "harness.resources.templates",
]
include-package-data = false

[tool.setuptools.package-data]
harness = ["candidate_pools.json"]
"harness.resources.materials" = ["README.md", "company/*.md", "candidates/*/*.json", "candidates/*/*.txt", "candidates/*/*.pdf", "candidates/*/*.md"]
"harness.resources.prompts" = ["*.md"]
"harness.resources.templates" = ["*.md"]
"harness.resources.candidate_runtime" = ["manifest.json", "personas/*.json"]

[tool.pytest.ini_options]
testpaths = ["developer/tests"]
addopts = "-ra"
